services:
  devops-dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devops-automation-dashboard
    restart: unless-stopped
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    environment:
      - NGINX_PORT=80
    labels:
      - "app=devops-automation-dashboard"
      - "environment=production"
